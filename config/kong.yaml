# SIT gateway configuration; defaults follow the previously verified .228 baseline.
# Host file: /etc/cmtf2/kong/kong.yml -> container /etc/kong/kong.yml.
# Edit mounted host file, then restart Kong. No image rebuild required.
# SITE CHECK: upstream targets, native auth path, CA certificates and S3 forwarding.
# Preserve /api routes and strip_path behavior. Names containing v1 are identifiers.
# Listener/TLS private-key paths remain in existing /etc/cmtf2/kong/kong.conf.
# Public cmtf2sit domain is handled by the existing external Nginx configuration.
_format_version: '3.0'
_transform: true
services:
- name: nocobase-native-auth-service
  protocol: https
  host: nocobase-backend
  port: 8443
  tls_verify: true
  ca_certificates:
  - 7f3a9c1e-2b4d-4e5f-8a9b-0c1d2e3f4a5b
  - 7f3a9c1e-2b4d-4e5f-8a9b-0c1d2e3f4a5c
  tls_verify_depth: 3
  path: /cmtf2/api/auth:signIn
  retries: 0
  connect_timeout: 5000
  read_timeout: 10000
  write_timeout: 10000
  routes:
  - name: nocobase-native-token-v1-route
    protocols:
    - http
    - https
    methods:
    - POST
    paths:
    - /api/auth/token
    strip_path: true
    preserve_host: false
    request_buffering: true
    response_buffering: true
    plugins:
    - name: request-transformer
      config:
        remove:
          headers:
          - Authorization
          - X-API-Key
          - X-Authenticator
        add:
          headers:
          - X-Authenticator:basic
    - name: rate-limiting
      config:
        minute: 10
        limit_by: ip
        policy: local
        fault_tolerant: true
    - name: request-size-limiting
      config:
        allowed_payload_size: 1
        size_unit: megabytes
        require_content_length: true
- name: nocobase-file-adapter-service
  protocol: http
  host: 127.0.0.1
  port: 8080
  retries: 0
  connect_timeout: 5000
  read_timeout: 600000
  write_timeout: 600000
  routes:
  - name: nocobase-adapter-health-v1-route
    protocols:
    - http
    - https
    methods:
    - GET
    paths:
    - ~/api/health/live$
    - ~/api/health/ready$
    strip_path: false
    preserve_host: false
    path_handling: v0
    request_buffering: true
    response_buffering: true
    plugins:
    - name: request-transformer
      config:
        remove:
          headers:
          - Authorization
          - X-API-Key
          - X-Authenticator
          - X-Adapter-Key
          - X-Consumer-Custom-ID
          - X-NocoBase-Authorization
    - name: rate-limiting
      config:
        minute: 120
        limit_by: ip
        policy: local
        fault_tolerant: true
